[env:esp12E]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 3000000
check_tool = cppcheck
check_skip_packages = yes
extra_scripts = 
	pre:renameFirmware.py
	post:copyFirmware.py
